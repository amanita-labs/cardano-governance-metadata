name: Deploy demo to GitHub Pages

on:
  push:
    # `main` is the production source. `demo-app` is included so the
    # work-in-progress demo can be previewed before it's merged — remove it
    # from this list once the demo lands on main.
    branches: [main, demo-app]
  workflow_dispatch:

# Least-privilege token plus the OIDC/pages scopes the deploy step needs.
permissions:
  contents: read
  pages: write
  id-token: write

# Only one Pages deployment at a time; newer pushes supersede in-flight runs.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ── Build the library (the demo consumes its built dist/ via file:..) ──
      # Pinned: bun 1.3.x regressed `bun build` on this re-export-heavy entry,
      # emitting a stub dist/index.js whose exports reference undefined names
      # (cip100, ErrorCode, …). 1.2.13 produces a correct self-contained bundle.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.13

      - name: Install library deps
        run: bun install --frozen-lockfile

      - name: Build library
        run: bun run build

      - name: Verify library dist is a complete bundle
        # Fail fast with a clear message if the build ever emits a stub dist
        # again (e.g. a future bun bump), instead of a cryptic Rollup error in
        # the demo build below.
        run: |
          node --input-type=module -e "
            import('./dist/index.js').then((m) => {
              const need = ['cip100','cip108','cip119','cip136','cip169','detectCipStandard','resolve','fetchMetadata','decodeCoseSign1','verifyCip8Witness','createDocumentLoader','registerContext','listBundledContextUrls'];
              const missing = need.filter((k) => m[k] === undefined);
              if (missing.length) { console.error('Incomplete library dist — missing runtime exports: ' + missing.join(', ')); process.exit(1); }
              console.log('Library dist exports OK (' + need.length + ' checked).');
            }).catch((e) => { console.error(e); process.exit(1); });
          "

      # ── Build the demo (static SPA) ───────────────────────────────────────
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install demo deps
        working-directory: demo
        run: npm ci

      - name: Build demo
        working-directory: demo
        # Project Pages serve under /<repo>/, so asset URLs need that base.
        # Passed only here — local `npm run dev` / `build` stay at "/".
        run: npm run build -- --base=/governance-metadata/

      - name: Disable Jekyll processing
        run: touch demo/dist/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: demo/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
