name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Pinned: bun 1.3.x regressed `bun build` on the re-export-heavy entry,
      # emitting a stub dist/index.js with undefined exports. 1.2.13 is known
      # good; `bun run build` also self-verifies via `check:dist`.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.13

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Type-check
        run: bun run type-check

      - name: Test (with coverage)
        run: bun test --coverage

      - name: Build
        run: bun run build

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          retention-days: 14
